[package]
name = "ndcv-bridge"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
bounding-box.workspace = true
nalgebra.workspace = true
bytemuck.workspace = true
fast_image_resize.workspace = true
ndarray = { workspace = true, features = ["rayon"] }
num.workspace = true
opencv = { workspace = true, optional = true }
rayon = "1.10.0"
thiserror.workspace = true
tracing = "0.1.41"
wide = "1.1.1"
tap = { workspace = true }
img-parts.workspace = true
pretty_assertions = "1.4.1"
glam = { version = "0.32.0", features = ["bytemuck"], optional = true }

[dev-dependencies]
divan.workspace = true
ndarray-npy.workspace = true

[features]
# The OpenCV operator modules (blur, gaussian, ...) use glam types, so opencv
# requires glam.
opencv = ["dep:opencv", "glam"]
glam = ["dep:glam"]
# nalgebra is a non-optional dependency (roi, contours and dilate use it
# unconditionally); this feature only gates the SVector CvType impls.
nalgebra = []
# Operators on OpenCV modules that not every OpenCV build ships: `ximgproc` is
# in opencv_contrib (guided_filter), and `photo` can be left out of minimal
# builds (edge_preserving_filter). The gate is the `#[cfg]` on ndcv's own
# modules: opencv-rust only generates bindings for modules the linked OpenCV
# has, so leaving these off keeps ndcv building against such an OpenCV. The
# `opencv/...` forwards are no-ops while the workspace keeps opencv's default
# features (which enable every module); they matter only if that dependency
# moves to `default-features = false`.
ximgproc = ["opencv", "opencv/ximgproc"]
photo = ["opencv", "opencv/photo"]
default = ["opencv", "glam", "nalgebra"]


[[bench]]
name = "conversions"
harness = false

[[bench]]
name = "gaussian"
harness = false

[[bench]]
name = "blur"
harness = false

[[bench]]
name = "dilate"
harness = false
